name: Temporary responsive panels check

on:
  push:
    branches:
      - chatgpt/responsive-floating-panels
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/responsive-floating-panels
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run static and type checks
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run floating-panel and existing canvas regressions
        run: npx playwright test tests/floating-panels.spec.ts tests/canvas-features.spec.ts
      - name: Update handoff after successful validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('AI_HANDOFF.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Responsive floating-panel anchoring (2026-09-11)'
          if marker not in text:
              text += '''\n\n### Responsive floating-panel anchoring (2026-09-11)\n\nThis update remains **schema v12** and changes runtime/UI layout behavior only. `src/ui/floating-panels.ts` is the responsive coordinator for the persistent floating UI. Layers defaults to a top-left 18px edge relationship; Properties defaults to top-right 18px. After a user drag finishes, the nearest horizontal edge plus that edge distance and the top offset are retained as runtime panel metadata. Window resize/maximize/restore recomputes positions from those anchors and clamps the rendered result to an 8px safe viewport margin without overwriting the saved offset, so restoring a larger window restores the intended relative placement. Collapsed and expanded panel sizes use the same anchor.\n\nPanel width/control/font sizing is not resolution-scaled. When the viewport is too short, Layers/Properties use a viewport-limited panel height and internal content scrolling instead. The existing bottom toolbar remains CSS bottom-centered. Window resize work is deduplicated through the centralized `renderer/index.ts` visual-frame scheduler: one shared visual frame measures the viewport, resizes the high-DPI canvas, reflows floating panels, and paints once. The synchronous bootstrap `resize()` call is retained before project recovery loading. This is runtime-only state and does not alter project files, recovery data, history, or schema.\n'''
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temporary-responsive-panels-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_HANDOFF.md .github/workflows/temporary-responsive-panels-check.yml
          if ! git diff --cached --quiet; then
            git commit -m "Document responsive floating panel behavior"
            git push origin HEAD:chatgpt/responsive-floating-panels
          fi
